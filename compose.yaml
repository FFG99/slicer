services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slicer
      POSTGRES_PASSWORD: slicer
      POSTGRES_DB: slicer
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U slicer -d slicer
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
    - 127.0.0.1:8000:8000
    environment:
      DATABASE_URL: postgresql://slicer:slicer@postgres:5432/slicer
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: slicer-artifacts
      MINIO_SECURE: 'false'
      SLICER_BIN: /usr/local/bin/slicer
      SLICER_SYSTEMS_DIR: /var/lib/slicer/systems
      SYSTEMS_REGISTRY_PATH: /var/lib/slicer/systems/systems-registry.yaml
      WORK_DIR: /tmp/slicer-api
    volumes:
    - slicer_systems_data:/var/lib/slicer/systems
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://slicer:slicer@postgres:5432/slicer
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: slicer-artifacts
      MINIO_SECURE: 'false'
      SLICER_BIN: /usr/local/bin/slicer
      SLICER_SYSTEMS_DIR: /var/lib/slicer/systems
      POLL_INTERVAL_SECONDS: '2'
      WORK_DIR: /tmp/slicer-worker
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-3600}
    volumes:
    - slicer_systems_data:/var/lib/slicer/systems:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}
    cpus: ${WORKER_CPU_LIMIT:-2}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    entrypoint:
    - python
    - -m
    - slicer_worker.main
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:5173:5173
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data: {}
  minio_data: {}
  slicer_systems_data: {}
name: slicer-students
