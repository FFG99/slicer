[project]
name = "slicer-worker"
version = "0.1.0"
description = "Job worker for Slicer"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "minio>=7.2.0",
    "h5py>=3.11.0",
]

[project.scripts]
slicer-worker = "slicer_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slicer_worker"]
