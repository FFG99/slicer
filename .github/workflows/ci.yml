name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          pip install -e ".[dev]"
          pytest -q

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON schemas
        run: |
          python -m json.tool schemas/job-spec.json > /dev/null
          python -m json.tool schemas/coordinate-frame.json > /dev/null

      - name: Validate calculation registry
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('schemas/calculation-registry.yaml'))"

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libomp-dev

      - name: Configure, build, test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -- -j$(nproc)
          ctest --test-dir build --output-on-failure
