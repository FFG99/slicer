[project]
name = "slicer-api"
version = "0.1.0"
description = "Orchestration API for Slicer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    "h5py>=3.11.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slicer_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
